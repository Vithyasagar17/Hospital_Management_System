{% extends 'layout.html' %}

{% block title %}My profile{% endblock %}
{% block page_title %}My profile{% endblock %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height:65vh;">
  <div class="card shadow-sm" style="width:100%;max-width:720px;">
    <div class="card-body">
      <h3 class="card-title mb-2">Your Profile</h3>
      <p class="text-muted mb-4">Provide basic details for your doctor to view.</p>

      <form method="POST" action="{{ url_for('patient.patient_profile') }}"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="name">Full name</label>
            <input id="name" name="name" class="form-control" type="text" required value="{{ patient.name if patient else '' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="contact">Contact</label>
            <input id="contact" name="contact" class="form-control" type="text" value="{{ patient.contact if patient else '' }}">
          </div>
        </div>

        <div class="mb-3 mt-3">
          <label class="form-label" for="address">Address</label>
          <input id="address" name="address" class="form-control" type="text" value="{{ patient.address if patient else '' }}">
        </div>

        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label" for="age">Age</label>
            <input id="age" name="age" class="form-control" type="number" min="0" value="{{ patient.age if patient and patient.age is not none else '' }}">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="gender">Gender</label>
            <select id="gender" name="gender" class="form-select">
              <option value="">Select</option>
              <option value="Male" {% if patient and patient.gender == 'Male' %}selected{% endif %}>Male</option>
              <option value="Female" {% if patient and patient.gender == 'Female' %}selected{% endif %}>Female</option>
              <option value="Other" {% if patient and patient.gender == 'Other' %}selected{% endif %}>Other</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="height">Height (cm)</label>
            <input id="height" name="height" class="form-control" type="number" step="0.1" value="{{ patient.height if patient and patient.height is not none else '' }}">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="weight">Weight (kg)</label>
            <input id="weight" name="weight" class="form-control" type="number" step="0.1" value="{{ patient.weight if patient and patient.weight is not none else '' }}">
          </div>
        </div>

        <div class="d-grid mt-4">
          <button class="btn btn-primary btn-lg" type="submit">Save Profile</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
