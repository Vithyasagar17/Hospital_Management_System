{% extends 'layout.html' %}

{% block title %}Add doctor{% endblock %}
{% block page_title %}Add doctor{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2>Add New Doctor</h2>

  <form method="POST" class="mt-4">
    <div class="form-group mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" name="username" required>
      <small class="form-text text-muted">Unique username for doctor login</small>
    </div>

    <div class="form-group mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" required>
      <small class="form-text text-muted">Secure password for the doctor account</small>
    </div>

    <div class="form-group mb-3">
      <label for="name" class="form-label">Full Name</label>
      <input type="text" class="form-control" id="name" name="name" required>
    </div>

    <div class="form-group mb-3">
      <label for="specialization_id" class="form-label">Specialization</label>
      <select class="form-control" id="specialization_id" name="specialization_id">
        <option value="">-- Select Specialization --</option>
        {% for spec in specializations %}
        <option value="{{ spec.id }}">{{ spec.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <button type="submit" class="btn btn-primary">Add Doctor</button>
      <a href="{{ url_for('admin.admin_doctors') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
