{% extends 'layout.html' %}

{% block title %}Edit patient{% endblock %}
{% block page_title %}Edit patient{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2>Edit Patient</h2>

  <form method="POST" class="mt-4">
    <div class="form-group mb-3">
      <label for="name" class="form-label">Full Name</label>
      <input type="text" class="form-control" id="name" name="name" value="{{ patient.name or '' }}" required>
    </div>

    <div class="form-group mb-3">
      <label for="contact" class="form-label">Contact Number</label>
      <input type="text" class="form-control" id="contact" name="contact" value="{{ patient.contact or '' }}">
    </div>

    <div class="form-group mb-3">
      <label for="address" class="form-label">Address</label>
      <input type="text" class="form-control" id="address" name="address" value="{{ patient.address or '' }}">
    </div>

    <div class="form-row">
      <div class="form-group col-md-6 mb-3">
        <label for="age" class="form-label">Age</label>
        <input type="number" class="form-control" id="age" name="age" value="{{ patient.age or '' }}">
      </div>

      <div class="form-group col-md-6 mb-3">
        <label for="gender" class="form-label">Gender</label>
        <select class="form-control" id="gender" name="gender">
          <option value="">-- Select --</option>
          <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
          <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
          <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-md-6 mb-3">
        <label for="height" class="form-label">Height (cm)</label>
        <input type="number" step="0.1" class="form-control" id="height" name="height" value="{{ patient.height or '' }}">
      </div>

      <div class="form-group col-md-6 mb-3">
        <label for="weight" class="form-label">Weight (kg)</label>
        <input type="number" step="0.1" class="form-control" id="weight" name="weight" value="{{ patient.weight or '' }}">
      </div>
    </div>

    <div class="form-group">
      <button type="submit" class="btn btn-primary">Update Patient</button>
      <a href="{{ url_for('admin.admin_patients') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
