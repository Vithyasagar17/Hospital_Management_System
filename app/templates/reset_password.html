{% extends 'layout.html' %}{% block title %}Reset password{% endblock %}{% block auth_content %}
<div class="hms-auth-kicker">Secure reset</div><h2 class="hms-auth-title">Choose a new password</h2><p class="hms-auth-subtitle">Use at least 8 characters with uppercase, lowercase and a number.</p><form method="POST"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">New password</label><input name="password" type="password" class="form-control" required autocomplete="new-password"></div><div class="mb-4"><label class="form-label">Confirm password</label><input name="confirm_password" type="password" class="form-control" required autocomplete="new-password"></div><div class="d-grid"><button class="btn btn-primary btn-lg">Reset password</button></div></form>
{% endblock %}
