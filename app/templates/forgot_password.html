{% extends 'layout.html' %}{% block title %}Forgot password{% endblock %}{% block auth_content %}
<div class="hms-auth-kicker">Account recovery</div><h2 class="hms-auth-title">Reset your password</h2><p class="hms-auth-subtitle">Enter your username or verified email address. For privacy, HMS always returns the same response.</p>
<form method="POST"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="identifier">Username or email</label><input class="form-control" id="identifier" name="identifier" required autocomplete="username"></div><div class="d-grid"><button class="btn btn-primary btn-lg">Send reset link</button></div></form><div class="text-center mt-4"><a href="{{ url_for('auth.login') }}">Back to sign in</a></div>
{% endblock %}
