{% extends 'layout.html' %}

{% block title %}New prescription{% endblock %}
{% block page_title %}New prescription{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2>Create Prescription</h2>

  <form method="POST" action="{{ url_for('doctor.new_prescription') }}">
    <div class="mb-3">
      <label for="appointment_id" class="form-label">Select Appointment (Confirmed)</label>
      <select id="appointment_id" name="appointment_id" class="form-select" required>
        <option value="">Choose appointment...</option>
        {% for a in appointments %}
        <option value="{{ a.id }}" data-reason="{{ a.reason|e }}">{{ a.date.strftime('%Y-%m-%d') if a.date else '—' }} {{ a.time }} — {{ a.patient.name if a.patient else '—' }}</option>
        {% endfor %}
      </select>

      <div id="appointment-reason" class="mt-3 alert alert-secondary" style="display:none;"></div>
    </div>

    <button class="btn btn-success" type="submit">Create Prescription</button>
    <a href="{{ url_for('doctor.prescriptions') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var sel = document.getElementById('appointment_id');
    var reasonBox = document.getElementById('appointment-reason');
    function updateReason() {
      var opt = sel.options[sel.selectedIndex];
      if (opt && opt.dataset && opt.dataset.reason) {
        var txt = opt.dataset.reason.trim();
        if (txt) {
          reasonBox.style.display = 'block';
          reasonBox.textContent = 'Reason / Symptoms: ' + txt;
          return;
        }
      }
      reasonBox.style.display = 'none';
      reasonBox.textContent = '';
    }
    sel.addEventListener('change', updateReason);
    updateReason();
  });
</script>
{% endblock %}
