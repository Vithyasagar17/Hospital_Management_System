{% extends 'layout.html' %}
{% block title %}Sign in{% endblock %}

{% block auth_content %}
<div class="hms-auth-kicker">Welcome back</div>
<h2 class="hms-auth-title">Sign in to your workspace</h2>
<p class="hms-auth-subtitle">Use your HMS credentials to continue to your personalized portal.</p>

<form method="POST" action="{{ url_for('auth.login') }}"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label for="username" class="form-label">Username</label>
    <div class="input-group">
      <span class="input-group-text bg-white border-end-0" style="border-color:#dde1ea;border-radius:11px 0 0 11px;"><i class="bi bi-person text-muted"></i></span>
      <input id="username" name="username" type="text" class="form-control border-start-0 ps-1" style="border-radius:0 11px 11px 0;" placeholder="Enter your username" required autocomplete="username" autofocus>
    </div>
  </div>
  <div class="mb-4">
    <label for="password" class="form-label">Password</label>
    <div class="input-group">
      <span class="input-group-text bg-white border-end-0" style="border-color:#dde1ea;border-radius:11px 0 0 11px;"><i class="bi bi-lock text-muted"></i></span>
      <input id="password" name="password" type="password" class="form-control border-start-0 ps-1" style="border-radius:0 11px 11px 0;" placeholder="Enter your password" required autocomplete="current-password">
    </div>
  </div>
  <div class="d-flex justify-content-end mb-3"><a href="{{ url_for('auth.forgot_password') }}" class="small fw-semibold">Forgot password?</a></div>
  <div class="d-grid">
    <button type="submit" class="btn btn-primary btn-lg">Sign in <i class="bi bi-arrow-right ms-1"></i></button>
  </div>
  <div class="text-center mt-4" style="font-size:.8rem;color:var(--hms-muted);">
    New to HMS? <a href="{{ url_for('auth.register') }}" class="fw-semibold">Create an account</a>
  </div>
</form>
{% endblock %}
