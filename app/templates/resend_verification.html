{% extends 'layout.html' %}{% block title %}Verify email{% endblock %}{% block auth_content %}
<div class="hms-auth-kicker">Email verification</div><h2 class="hms-auth-title">Resend verification</h2><p class="hms-auth-subtitle">Enter your username or email. In local console mail mode, the verification link is printed in the terminal.</p><form method="POST"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="mb-4"><label class="form-label">Username or email</label><input name="identifier" value="{{ username }}" class="form-control" required></div><div class="d-grid"><button class="btn btn-primary btn-lg">Send verification</button></div></form><div class="text-center mt-4"><a href="{{ url_for('auth.login') }}">Back to sign in</a></div>
{% endblock %}
